<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="../CSS/styles.css">
</head>
<body>
    <div class="container">
      <button id="testForm" popovertarget="addTest-form">Add</button>
    </div>

    <div id="addTest-form" popover="manual">
      <label for="nameTest">Name:</label>
      <input type="text" id="nameTest" placeholder="Enter your test name..." required>
      <button id="addTest" popovertarget="addTest-form" popovertargetaction="hide">Enter</button>
      <button id="closePop" popovertarget="addTest-form" popovertargetaction="hide">Close</button>
    </div>

  <script src="../JS/script.js"></script>
</body>
</html>
